<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-dark: #141416;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-glow-p: rgba(168, 85, 247, 0.4);
            --accent-glow-g: rgba(16, 185, 129, 0.4);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔒 FRESH CLEAN KEY PROMPT INPUT SCREEN */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(9, 9, 11, 0.98);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .portal-title {
            font-size: 2.5rem; margin-bottom: 2rem; letter-spacing: 2px; font-weight: 800;
            color: var(--accent-purple); text-shadow: 0 0 20px var(--accent-glow-p);
        }

        .portal-title span { color: var(--text-main); font-size: 1.2rem; font-weight: 400; margin-left: 10px; }

        .auth-card {
            background: var(--panel-dark); border: 1px solid #27272a; padding: 2.5rem;
            border-radius: 20px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .auth-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .inline-input-group { display: flex; gap: 12px; align-items: center; justify-content: center; }

        .auth-card input {
            flex-grow: 1; background: #09090b; border: 1px solid #3f3f46; padding: 0.9rem 1.2rem;
            border-radius: 10px; color: white; font-size: 1.05rem; text-align: center;
            letter-spacing: 2px; outline: none; transition: border-color 0.3s ease;
        }

        .auth-card input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px var(--accent-glow-p); }

        .auth-btn, .action-btn {
            background: var(--accent-green); color: white; border: none; padding: 0.9rem 1.8rem;
            border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
            text-transform: uppercase; transition: transform 0.2s, background 0.3s;
        }

        .auth-btn:hover, .action-btn:hover { background: #059669; transform: translateY(-2px); }

        #loginOverlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* ⏳ TOP RIGHT META CONTROLS WIDGET */
        #metaStatusWidget {
            position: fixed; top: 25px; right: 25px; 
            background: rgba(20, 20, 22, 0.9);
            border: 1px solid #27272a; backdrop-filter: blur(10px); 
            padding: 1rem 1.5rem; border-radius: 20px; 
            display: none; flex-direction: column; gap: 6px; 
            z-index: 9000; opacity: 0; transition: opacity 0.5s ease;
            text-align: right; min-width: 220px;
        }

        .status-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-weight: 600; font-size: 0.95rem; }
        .timer-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }
        .limit-row { font-size: 0.85rem; color: var(--accent-purple); font-weight: 700; margin-top: 2px; letter-spacing: 0.5px; }

        /* 🚪 BOTTOM RIGHT LOGOUT CONTAINER */
        #logoutContainer {
            position: fixed; bottom: 25px; right: 25px;
            z-index: 9000; display: none; opacity: 0; transition: opacity 0.5s ease;
        }

        .logout-btn {
            background: rgba(244, 63, 94, 0.1); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 0.6rem 1.2rem; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #f43f5e; color: white; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); transform: translateY(-1px);
        }

        /* 🖥️ MAIN WORKSPACE CONTAINER */
        #mainWorkspace { text-align: center; opacity: 0; transform: scale(0.98); transition: opacity 0.5s ease, transform 0.5s ease; }
        #mainWorkspace.loaded { opacity: 1; transform: scale(1); }

        .dashboard-layout { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="portal-title">OnlyZens <span>ai</span></div>
        <div class="auth-card">
            <p>Verification module active. Input dynamic access key to authorize session.</p>
            <div class="inline-input-group">
                <input type="text" id="licenseKeyInput" placeholder="ZENAI-XXXX-XXXX-XXXX" autocomplete="off" maxlength="20">
                <button class="auth-btn" onclick="submitVerification()">Verify</button>
            </div>
        </div>
    </div>

    <div id="metaStatusWidget">
        <div class="status-row">
            <div class="timer-dot"></div>
            <span style="color: var(--text-muted); font-weight: 400;">Time Left:</span>
            <span id="countdownClock" style="color: #fff">00h 00m 00s</span>
        </div>
        <div class="limit-row" id="dailyLimitText">Generations Left: 2</div>
    </div>

    <div id="mainWorkspace">
        <div class="dashboard-layout">
            <button class="action-btn" id="genScriptBtn" onclick="generateScript()">Generate Custom Script</button>
        </div>
    </div>

    <div id="logoutContainer">
        <button class="logout-btn" onclick="triggerSessionLogout()">Logout</button>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api'; 
        let internalTimerLoop = null;
        let globalRemainingMs = 0;
        let activeKey = '';
        let currentGenerationsLeft = 2;

        // 🔄 AUTO-LOGIN HOOK
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('onlyzens_auth_key');
            if (savedKey) {
                document.getElementById('licenseKeyInput').value = savedKey;
                silentVerify(savedKey);
            }
        });

        async function silentVerify(key) {
            try {
                const response = await fetch(`${API_BASE_URL}/verify-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });
                const data = await response.json();
                if (response.ok && data.allowed) {
                    activeKey = key;
                    updateGenerationUI(data.generationsToday, data.isAdmin);
                    handleSuccessfulLogin(data.timeLeftMs);
                } else {
                    localStorage.removeItem('onlyzens_auth_key');
                }
            } catch (err) {
                console.error("Auto-login backend connection error.");
            }
        }

        async function submitVerification() {
            const inputField = document.getElementById('licenseKeyInput');
            const licenseKey = inputField.value.trim().toUpperCase();

            if (!licenseKey) return alert("System requires an access license string.");

            try {
                const response = await fetch(`${API_BASE_URL}/verify-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: licenseKey })
                });
                const data = await response.json();

                if (response.ok && data.allowed) {
                    activeKey = licenseKey;
                    localStorage.setItem('onlyzens_auth_key', licenseKey);
                    updateGenerationUI(data.generationsToday, data.isAdmin);
                    handleSuccessfulLogin(data.timeLeftMs);
                } else {
                    alert(`ACCESS TERMINATED: ${data.error || 'Authentication Failure.'}`);
                }
            } catch (err) {
                alert("Gatekeeper connection failure.");
            }
        }

        async function generateScript() {
            if (!activeKey) return;

            if (currentGenerationsLeft <= 0) {
                alert("🛑 LIMIT REACHED: You have 0 generations left for today!");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/use-generation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: activeKey })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert("🎨 Script generation successful!");
                    
                    if (data.remaining === "UNLIMITED") {
                        currentGenerationsLeft = "UNLIMITED";
                        document.getElementById('dailyLimitText').innerText = `Generations Left: ∞`;
                    } else {
                        currentGenerationsLeft = data.remaining;
                        document.getElementById('dailyLimitText').innerText = `Generations Left: ${data.remaining}`;
                        if (currentGenerationsLeft <= 0) {
                            setBtnDisabledState(true);
                        }
                    }
                } else {
                    alert(`🛑 LIMIT REACHED: ${data.message}`);
                    setBtnDisabledState(true);
                }
            } catch (err) {
                alert("Database logging connection error.");
            }
        }

        function updateGenerationUI(usedCount, isAdmin) {
            if (isAdmin) {
                currentGenerationsLeft = 999;
                document.getElementById('dailyLimitText').innerText = `Generations Left: ∞`;
                setBtnDisabledState(false);
            } else {
                currentGenerationsLeft = 2 - (usedCount || 0);
                document.getElementById('dailyLimitText').innerText = `Generations Left: ${currentGenerationsLeft}`;
                setBtnDisabledState(currentGenerationsLeft <= 0);
            }
        }

        function setBtnDisabledState(disabled) {
            const btn = document.getElementById('genScriptBtn');
            if (disabled) {
                btn.style.background = '#3f3f46';
                btn.style.cursor = 'not-allowed';
                btn.style.transform = 'none';
            } else {
                btn.style.background = 'var(--accent-green)';
                btn.style.cursor = 'pointer';
            }
        }

        function handleSuccessfulLogin(sessionTimeMs) {
            globalRemainingMs = sessionTimeMs;
            if (window.confetti) {
                confetti({ particleCount: 80, spread: 50, origin: { y: 0.6 }, colors: ['#a855f7', '#ffffff', '#10b981'] });
            }
            document.getElementById('loginOverlay').classList.add('hidden'); 
            document.getElementById('mainWorkspace').classList.add('loaded');
            
            // Show bottom right logout layout controls
            const logoutContainer = document.getElementById('logoutContainer');
            logoutContainer.style.display = 'block';
            setTimeout(() => logoutContainer.style.opacity = '1', 50);

            startLiveWidgetTimer();
        }

        function startLiveWidgetTimer() {
            const statusWidget = document.getElementById('metaStatusWidget');
            const clockDisplay = document.getElementById('countdownClock');
            statusWidget.style.display = 'flex';
            statusWidget.offsetHeight; 
            statusWidget.style.opacity = '1';

            if (internalTimerLoop) clearInterval(internalTimerLoop);

            internalTimerLoop = setInterval(() => {
                if (globalRemainingMs <= 0) {
                    triggerSessionLogout();
                    return;
                }
                globalRemainingMs -= 1000; 
                const totalSeconds = Math.floor(globalRemainingMs / 1000);
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                clockDisplay.innerText = `${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`;
            }, 1000);
        }

        // 🚪 MANUAL SESSION TERMINATOR
        function triggerSessionLogout() {
            clearInterval(internalTimerLoop);
            localStorage.removeItem('onlyzens_auth_key');
            activeKey = '';
            
            // UI Component resets
            document.getElementById('licenseKeyInput').value = '';
            document.getElementById('metaStatusWidget').style.display = 'none';
            document.getElementById('logoutContainer').style.display = 'none';
            document.getElementById('mainWorkspace').classList.remove('loaded');
            document.getElementById('loginOverlay').classList.remove('hidden');
        }

        document.getElementById('licenseKeyInput').addEventListener('input', function (e) {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            let formatted = value.startsWith('ZENAI') ? 'ZENAI' + (value.substring(5).length > 0 ? '-' + value.substring(5, 9) : '') + (value.substring(9).length > 0 ? '-' + value.substring(9, 13) : '') + (value.substring(13).length > 0 ? '-' + value.substring(13, 17) : '') : value.substring(0,20);
            e.target.value = formatted;
        });
    </script>
</body>
</html>
