<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-dark: #141416;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-glow-p: rgba(168, 85, 247, 0.4);
            --accent-glow-g: rgba(16, 185, 129, 0.4);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(9, 9, 11, 0.98);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .portal-title {
            font-size: 2.5rem; margin-bottom: 2rem; letter-spacing: 2px; font-weight: 800;
            color: var(--accent-purple); text-shadow: 0 0 20px var(--accent-glow-p);
            animation: slideDownIn 0.8s ease forwards; opacity: 0;
        }

        .portal-title span { color: var(--text-main); font-size: 1.2rem; font-weight: 400; margin-left: 10px; }

        .auth-card {
            background: var(--panel-dark); border: 1px solid #27272a; padding: 2.5rem;
            border-radius: 20px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            animation: slideUpIn 0.8s ease forwards; animation-delay: 0.1s; opacity: 0;
        }

        .auth-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .inline-input-group { display: flex; gap: 12px; align-items: center; justify-content: center; }

        .auth-card input {
            flex-grow: 1; background: #09090b; border: 1px solid #3f3f46; padding: 0.9rem 1.2rem;
            border-radius: 10px; color: white; font-size: 1.05rem; text-align: center;
            letter-spacing: 2px; outline: none; transition: border-color 0.3s ease;
        }

        .auth-card input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px var(--accent-glow-p); }

        .auth-btn, .action-btn {
            background: var(--accent-green); color: white; border: none; padding: 0.9rem 1.8rem;
            border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
            text-transform: uppercase; transition: transform 0.2s, background 0.3s;
        }

        .auth-btn:hover, .action-btn:hover { background: #059669; transform: translateY(-2px); }

        #authOverlay.authenticated { opacity: 0; visibility: hidden; pointer-events: none; }

        /* ⏳ FLOATING TIMER WIDGET */
        #liveTimerWidget {
            position: fixed; top: 25px; right: 25px; background: rgba(20, 20, 22, 0.9);
            border: 1px solid #27272a; backdrop-filter: blur(10px); padding: 0.7rem 1.4rem;
            border-radius: 40px; display: none; align-items: center; gap: 12px; font-weight: 700;
            z-index: 9000; opacity: 0; transition: opacity 0.5s ease;
        }

        .timer-dot { width: 9px; height: 9px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        /* 🖥️ MAIN WORKSPACE CONTENT */
        #mainWorkspace { text-align: center; opacity: 0; transform: scale(0.98); transition: opacity 0.5s ease, transform 0.5s ease; }
        #mainWorkspace.loaded { opacity: 1; transform: scale(1); }

        .dashboard-container h2 { font-size: 3rem; margin-bottom: 1rem; color: #fff; }
        .dashboard-container p { color: var(--text-muted); margin-bottom: 2rem; }

        .script-box {
            background: var(--panel-dark); border: 1px solid #27272a; padding: 2rem;
            border-radius: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .limit-display { color: var(--accent-purple); font-weight: bold; margin-top: 10px; font-size: 0.9rem; }

        @keyframes slideDownIn { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="portal-title">OnlyZens <span>ai</span></div>
        <div class="auth-card">
            <p>Verification module active. Input dynamic access key to authorize session.</p>
            <div class="inline-input-group">
                <input type="text" id="licenseKeyInput" placeholder="ZENAI-XXXX-XXXX-XXXX" autocomplete="off" maxlength="20">
                <button class="auth-btn" onclick="submitVerification()">Verify</button>
            </div>
        </div>
    </div>

    <div id="liveTimerWidget">
        <div class="timer-dot"></div>
        <span style="color: var(--text-muted); font-weight: 400">Session Remaining:</span>
        <span id="countdownClock" style="color: #fff">00h 00m 00s</span>
    </div>

    <div id="mainWorkspace">
        <div class="dashboard-container">
            <h2>System Authorized</h2>
            <p>Hardware fingerprint matched. Access to core workspace panels is now available.</p>
            
            <div class="script-box">
                <button class="action-btn" onclick="generateScript()">Generate Custom Script</button>
                <div class="limit-display" id="dailyLimitText">Daily Limit Used: 0 / 2</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api'; 
        let internalTimerLoop = null;
        let globalRemainingMs = 0;
        let activeKey = '';

        // 🔄 AUTO-LOGIN INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('onlyzens_auth_key');
            if (savedKey) {
                // Pre-fill input field and automatically execute check
                document.getElementById('licenseKeyInput').value = savedKey;
                silentVerify(savedKey);
            }
        });

        async function silentVerify(key) {
            try {
                const response = await fetch(`${API_BASE_URL}/verify-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });
                const data = await response.json();
                if (response.ok && data.allowed) {
                    activeKey = key;
                    document.getElementById('dailyLimitText').innerText = `Daily Limit Used: ${data.generationsToday || 0} / 2`;
                    handleSuccessfulLogin(data.timeLeftMs);
                } else {
                    localStorage.removeItem('onlyzens_auth_key'); // Saved key expired or deleted
                }
            } catch (err) {
                console.error("Auto-login failed to connect to backend engine.");
            }
        }

        async function submitVerification() {
            const inputField = document.getElementById('licenseKeyInput');
            const licenseKey = inputField.value.trim().toUpperCase();

            if (!licenseKey) return alert("System requires an access license string.");

            try {
                const response = await fetch(`${API_BASE_URL}/verify-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: licenseKey })
                });
                const data = await response.json();

                if (response.ok && data.allowed) {
                    activeKey = licenseKey;
                    // 💾 SAVE KEY TO REMEMBER IT NEXT TIME
                    localStorage.setItem('onlyzens_auth_key', licenseKey);
                    document.getElementById('dailyLimitText').innerText = `Daily Limit Used: ${data.generationsToday || 0} / 2`;
                    handleSuccessfulLogin(data.timeLeftMs);
                } else {
                    alert(`ACCESS TERMINATED: ${data.error || 'Authentication Checksum Failure.'}`);
                }
            } catch (err) {
                alert("Communication error: Unable to reach secure authentication gatekeeper.");
            }
        }

        // FUNCTION TO HANDLE RUNNING SCRIPTS AND DAILY LIMITS
        async function generateScript() {
            if (!activeKey) return;

            try {
                const response = await fetch(`${API_BASE_URL}/use-generation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: activeKey })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert("🎨 Script generation successful! Enjoy your setup.");
                    // Dynamic math calculation to update used limit display
                    const used = 2 - data.remaining;
                    document.getElementById('dailyLimitText').innerText = `Daily Limit Used: ${used} / 2`;
                } else {
                    alert(`🛑 LIMIT REACHED: ${data.message}`);
                }
            } catch (err) {
                alert("Could not connect to database limit tracking nodes.");
            }
        }

        function handleSuccessfulLogin(sessionTimeMs) {
            globalRemainingMs = sessionTimeMs;
            if (window.confetti) {
                confetti({ particleCount: 100, spread: 60, origin: { y: 0.6 }, colors: ['#a855f7', '#ffffff', '#10b981'] });
            }
            document.getElementById('authOverlay').classList.add('authenticated'); 
            document.getElementById('mainWorkspace').classList.add('loaded');
            startLiveWidgetTimer();
        }

        function startLiveWidgetTimer() {
            const timerWidget = document.getElementById('liveTimerWidget');
            const clockDisplay = document.getElementById('countdownClock');
            timerWidget.style.display = 'flex';
            timerWidget.offsetHeight; 
            timerWidget.style.opacity = '1';

            internalTimerLoop = setInterval(() => {
                if (globalRemainingMs <= 0) {
                    clearInterval(internalTimerLoop);
                    localStorage.removeItem('onlyzens_auth_key');
                    window.location.reload(); 
                    return;
                }
                globalRemainingMs -= 1000; 
                const totalSeconds = Math.floor(globalRemainingMs / 1000);
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                clockDisplay.innerText = `${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`;
            }, 1000);
        }

        document.getElementById('licenseKeyInput').addEventListener('input', function (e) {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            let formatted = value.startsWith('ZENAI') ? 'ZENAI' + (value.substring(5).length > 0 ? '-' + value.substring(5, 9) : '') + (value.substring(9).length > 0 ? '-' + value.substring(9, 13) : '') + (value.substring(13).length > 0 ? '-' + value.substring(13, 17) : '') : value.substring(0,20);
            e.target.value = formatted;
        });
    </script>
</body>
</html>
